name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 方便 git describe

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Get version from tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="dev-$(date +%Y%m%d-%H%M%S)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build all platforms
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          # 缩短 commit 显示
          export COMMIT="$(git rev-parse --short HEAD)"
          ./build.sh

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
          body: |
            ## RealityChecker ${{ steps.version.outputs.version }}

            RealityChecker 用于发现、检测和筛选适合作为 Reality SNI 的目标网站。

            ### 核心能力
            - **IP 直接查询**：输入 VPS IP，自动查询所属 ASN、获取 RIPEstat 宣布网段，并按国家过滤候选 CIDR。
            - **自动扫描与筛选**：检测 TLS 1.3、X25519、HTTP/2、证书、SNI、握手延迟、重定向、地理位置和 CDN。
            - **推荐结果排序**：根据 CDN、热门网站、证书有效期、握手延迟和协议支持情况输出推荐星级。
            - **多种工作流**：支持 ASN 网段查询、单域名、批量域名、CSV 文件和 stdin 管道检测。

            ### 推荐工作流
            ```bash
            # 从 VPS IP 自动发现并筛选目标
            ./reality-checker auto 85.155.184.100 --limit 5

            # 查询 ASN 在指定国家的网段
            ./reality-checker asn AS15169 US > as15169-us.txt

            # 扫描自定义网段文件
            ./reality-checker auto --in as15169-us.txt --limit 10
