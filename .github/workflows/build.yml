````yaml
name: Build and Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build all platforms
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # Go
      # ==========================================
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ==========================================
      # Version
      # ==========================================
      - name: Get version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="dev-$(date -u +%Y%m%d-%H%M%S)"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          echo "======================================"
          echo "Version: ${VERSION}"
          echo "======================================"

      # ==========================================
      # Commit
      # ==========================================
      - name: Get commit
        id: commit
        shell: bash
        run: |
          COMMIT="$(git rev-parse --short HEAD)"

          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"

          echo "Commit: ${COMMIT}"

      # ==========================================
      # Build time
      # ==========================================
      - name: Get build time
        id: build_time
        shell: bash
        run: |
          BUILD_TIME="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          echo "time=${BUILD_TIME}" >> "$GITHUB_OUTPUT"

          echo "Build time: ${BUILD_TIME}"

      # ==========================================
      # Build
      # ==========================================
      - name: Build all platforms
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          BUILD_TIME: ${{ steps.build_time.outputs.time }}
        shell: bash
        run: |
          chmod +x build.sh

          ./build.sh

      # ==========================================
      # Verify artifacts
      # ==========================================
      - name: Verify build artifacts
        shell: bash
        run: |
          echo "======================================"
          echo "Build artifacts"
          echo "======================================"

          ls -lh dist/

          echo
          echo "Checking required binaries..."

          test -f dist/reality-checker-linux-amd64
          test -f dist/reality-checker-linux-arm64
          test -f dist/reality-checker-darwin-amd64
          test -f dist/reality-checker-darwin-arm64
          test -f dist/reality-checker-windows-amd64.exe

          echo
          echo "All required binaries exist."

      # ==========================================
      # Verify SHA256
      # ==========================================
      - name: Verify checksums
        shell: bash
        run: |
          cd dist

          sha256sum -c SHA256SUMS

      # ==========================================
      # Upload artifacts for manual/non-tag builds
      # ==========================================
      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: reality-checker-builds
          path: dist/
          if-no-files-found: error

      # ==========================================
      # Create GitHub Release
      # ==========================================
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          body: |
            ## RealityChecker ${{ steps.version.outputs.version }}

            RealityChecker 用于发现、检测和筛选适合作为 Reality SNI 的目标网站。

            ### 支持平台

            | 平台 | 架构 | 下载文件 |
            |---|---|---|
            | Linux | x86_64 | `reality-checker-linux-amd64` |
            | Linux | ARM64 | `reality-checker-linux-arm64` |
            | macOS | Intel x86_64 | `reality-checker-darwin-amd64` |
            | macOS | Apple Silicon | `reality-checker-darwin-arm64` |
            | Windows | x86_64 | `reality-checker-windows-amd64.exe` |

            ### macOS

            Apple Silicon Mac（M1 / M2 / M3 / M4 / M5 / M6）请下载：

            `reality-checker-darwin-arm64`

            Intel Mac 请下载：

            `reality-checker-darwin-amd64`

            ### 核心能力

            - IP 直接查询
            - ASN 网段查询
            - CIDR 自动发现
            - TLS 1.3 检测
            - X25519 检测
            - HTTP/2 检测
            - SNI 检测
            - 证书检测
            - TLS 握手延迟检测
            - 重定向检测
            - 地理位置检测
            - CDN 检测
            - 推荐结果排序

            ### 推荐工作流

            ```bash
            # 从 VPS IP 自动发现并筛选目标
            ./reality-checker auto 85.155.184.100 --limit 5

            # 查询 ASN 在指定国家的网段
            ./reality-checker asn AS15169 US > as15169-us.txt

            # 扫描自定义网段
            ./reality-checker auto --in as15169-us.txt --limit 10
            ```

            `auto` 输入单个 IPv4 会扩展为对应 `/24` 网段，
            IPv6 会扩展为 `/64`；输入 CIDR 时直接扫描该网段。

            `--limit` 表示最终保留的合适目标数量上限，默认值为 5。

            ### 其他用法

            ```bash
            ./reality-checker check example.com
            ./reality-checker batch example.com example.org
            ./reality-checker csv result.csv
            cat domains.txt | ./reality-checker pipe
            ```

            完整参数、配置和结果字段说明请参阅 README.md。

            ### Build Information

            - Version: `${{ steps.version.outputs.version }}`
            - Commit: `${{ steps.commit.outputs.commit }}`
            - Build Time: `${{ steps.build_time.outputs.time }}`

            SHA256 checksums are provided in `SHA256SUMS`.

            > 本工具仅用于技术研究和学习，请遵守当地法律法规并合理使用网络资源。

          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
````
